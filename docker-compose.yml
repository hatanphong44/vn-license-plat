# LPR Runtime Docker Compose
# 24/7 LPR inference runtime with GPU support
# CUDA 13.0 compatible (PyTorch 2.6 + PaddlePaddle 3.3.0.post130)

services:
  lpr-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lpr-runtime
    restart: unless-stopped
    runtime: nvidia  # GPU support via NVIDIA Container Toolkit
    environment:
      # Model paths - single root /models for all models
      - YOLO_MODEL_PATH=/models/Plate.pt
      - YOLO_DEVICE=0
      - PADDLE_DEVICE=gpu:0
      - PADDLE_MODEL_DIR=/models

      # Model parameters
      - YOLO_CONF=0.25
      - YOLO_IOU=0.45
      - OCR_UPSCALE=4
      - TEXT_PADDING=10
      - REC_MIN_SCORE=0.0

      # Camera settings
      - CAMERA_SOURCE=${CAMERA_SOURCE:-0}
      - INFERENCE_FPS=5.0
      - CAMERA_RECONNECT_DELAY=3
      - CAMERA_CONNECT_TIMEOUT=10
      - CAMERA_BUFFER_SIZE=1

      # Runtime settings
      - PLATE_COOLDOWN_SECONDS=30.0
      - MAX_CAPTURE_FRAMES=20
      - MAX_CAPTURE_WAIT_SECONDS=10.0
      - RESULT_WINDOW_SECONDS=3.0  # Configurable window duration

      # Event publisher
      - CALLBACK_URL=${CALLBACK_URL:-}
      - CALLBACK_TIMEOUT=5.0
      - CALLBACK_RETRY_COUNT=3
      - CALLBACK_RETRY_DELAY=1.0

      # Visualization
      - VISUALIZE=false  # Disabled by default for Docker (headless)
      - DISPLAY_FPS=true
      - SHOW_BOX=true
      - SHOW_TEXT=true

      # Logging
      - LOG_LEVEL=INFO
      - DEBUG=false

    volumes:
      # Mount models directory (single mount point)
      # Expected structure:
      # models/
      # ├── Plate.pt
      # ├── PP-OCRv6_small_det/
      # └── PP-OCRv6_small_rec/
      - ./models:/models:ro

    ports:
      - "8000:8000"  # API server

    # Healthcheck uses /ready endpoint which verifies GPU and models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; r=urllib.request.urlopen('http://localhost:8000/ready', timeout=5); data=json.loads(r.read()); exit(0 if data.get('ready') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    networks:
      - lpr-network

networks:
  lpr-network:
    driver: bridge
