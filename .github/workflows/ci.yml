name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff

      - name: Run ruff
        run: |
          ruff check .

  test:
    name: Pytest (CPU)
    runs-on: ubuntu-latest
    # Don't require GPU for unit tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pytest
        # Run pytest without GPU-dependent tests (mock GPU for tests)
        run: |
          pytest tests/unit/ -v --tb=short -x
        env:
          # Force CPU mode for CI
          YOLO_DEVICE: cpu
          PADDLE_DEVICE: cpu
          CUDA_VISIBLE_DEVICES: ""

  docker-build:
    name: Docker Build (CUDA 13.0)
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with CUDA 13.0
        run: |
          docker build -t lpr-runtime:test .

      - name: Validate docker-compose config
        run: |
          docker compose config > /dev/null
